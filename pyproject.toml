[project]
name = "sted"
version = "0.1.0"
description = "Semantic Tree Edit Distance (STED) for evaluating consistency of structured outputs"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Guanghui Wang"},
    {name = "Jinze Yu"},
    {name = "Xing Zhang"},
    {name = "Dayuan Jiang"},
    {name = "Tomal Deb"},
    {name = "Xuefeng Liu"},
    {name = "Peiyang He"},
    {name = "Yin Song"}
]
keywords = ["sted", "tree-edit-distance", "semantic-similarity", "json-consistency", "llm-evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "aiohttp>=3.8.0",
    "asyncio>=3.4.3",
    "bert-score>=0.3.13",
    "boto3>=1.26.0",
    "datasets>=3.6.0",
    "deepdiff>=8.5.0",
    "langchain>=0.3.26",
    "matplotlib>=3.10.3",
    "mpmath==1.3.0",
    "nltk>=3.9.1",
    "numpy>=1.20.0",
    "openai>=1.0.0",
    "pandas>=1.3.0",
    "python-dotenv>=1.0.0",
    "rouge>=1.0.1",
    "scikit-learn>=1.0.0",
    "scipy>=1.7.0",
    "seaborn>=0.13.2",
    "sentence-transformers>=4.1.0",
    "sympy==1.13.1",
    "tenacity>=9.1.2",
    "tqdm>=4.62.0",
    "zss>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sted"]
