[project]
name = "sted"
version = "0.1.0"
description = "Semantic Tree Edit Distance (STED) for evaluating consistency of LLM structured outputs"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "Guanghui Wang"},
    {name = "Jinze Yu"},
    {name = "Xing Zhang"},
    {name = "Dayuan Jiang"},
    {name = "Tomal Deb"},
    {name = "Xuefeng Liu"},
    {name = "Peiyang He"},
    {name = "Yin Song"}
]
keywords = [
    "sted",
    "tree-edit-distance",
    "semantic-similarity",
    "json-consistency",
    "llm-evaluation",
    "agent-evaluation",
    "tool-calling",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Core dependencies — required for the SemanticJsonTreeConsistencyEvaluator,
# StructuralConsistencyAnalyzer, and AgentConsistencyEvaluator main APIs.
# Sentence-Transformers (and its torch transitive) is included so that
# `pip install sted` works out-of-the-box without extras.
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "deepdiff>=8.0.0",
    "zss>=1.2.0",
    "tqdm>=4.62.0",
    "sentence-transformers>=2.2.0",
    "langchain-text-splitters>=0.0.1",
]

[project.optional-dependencies]
# AWS Bedrock backend for LLM-as-Judge / tool-call generation.
bedrock = [
    "boto3>=1.26.0",
]

# OpenAI / OpenAI-compatible (OpenRouter, etc.) backend.
openai = [
    "openai>=1.0.0",
]

# BERTScore baseline metric (optional comparison).
bertscore = [
    "bert-score>=0.3.13",
]

# YAML format converter (for non-JSON input parsing).
yaml = [
    "pyyaml>=6.0",
]

# Visualization helpers used by example notebooks.
viz = [
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
]

# Async / parallel helpers for high-throughput evaluation.
async = [
    "aioboto3>=12.0.0",
    "nest-asyncio>=1.5.0",
]

# Development / testing.
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

# Convenience: install everything optional.
all = [
    "sted[bedrock,openai,bertscore,yaml,viz,async]",
]

[project.urls]
Homepage = "https://github.com/amazon-science/sted"
Repository = "https://github.com/amazon-science/sted"
Issues = "https://github.com/amazon-science/sted/issues"

[project.scripts]
sted-eval = "sted.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sted"]

[tool.hatch.build.targets.sdist]
include = [
    "/sted",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
