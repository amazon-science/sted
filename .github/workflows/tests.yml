name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # ubuntu-latest (26.04) no longer ships 3.9, which requires-python still allows
          - os: ubuntu-22.04
            python: "3.9"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # CPU-only torch on Linux keeps the install to a few hundred MB.
      - name: Install CPU torch (Linux)
        if: runner.os == 'Linux'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      # `mcp` is skipped by its marker on 3.9; tests/test_mcp_server.py then skips itself.
      - name: Install package
        run: pip install -e ".[dev,mcp,embeddings]"

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-${{ runner.os }}

      # Live-API tests skip unless STED_LIVE_TESTS=1; these three files are scripts
      # that call live APIs at import time, so they are not collected at all.
      - name: Run tests
        run: >
          python -m pytest tests -q -p no:cacheprovider
          --ignore=tests/integration
          --ignore=tests/test_bedrock_openai.py
          --ignore=tests/test_oss_gpt.py
          --ignore=tests/langchang_test.py

      - name: sted-mcp starts and lists its tools
        if: matrix.python != '3.9'
        shell: python
        run: |
          import asyncio, shutil
          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client

          async def main():
              params = StdioServerParameters(command=shutil.which("sted-mcp"), args=[])
              async with stdio_client(params) as (r, w):
                  async with ClientSession(r, w) as s:
                      await s.initialize()
                      names = sorted(t.name for t in (await s.list_tools()).tools)
                      assert names == ["compare_outputs", "evaluate_consistency"], names
                      print("sted-mcp tools:", names)

          asyncio.run(main())

  # `pip install sted` without extras: no torch, text fields by character similarity.
  lite:
    name: lite (no torch) / py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package without extras
        run: pip install -e . pytest "mcp>=1.2,<2"   # 1.x here; 2.x in the step below
      - name: torch and sentence-transformers are absent
        shell: python
        run: |
          import importlib.util
          for m in ("torch", "sentence_transformers", "transformers"):
              assert importlib.util.find_spec(m) is None, f"{m} should not be installed"
          print("no torch, no sentence-transformers")
      - name: Run character-mode tests
        run: python -m pytest -q -p no:cacheprovider tests/test_lite.py tests/test_rules.py tests/test_command.py tests/test_api_surface.py tests/test_testing_helpers.py tests/test_agent_parsing_rules.py tests/test_mcp_server.py
      - name: MCP tests on mcp 2.x
        run: |
          pip install "mcp>=2,<3"
          python -c "import importlib.metadata as m; print('mcp', m.version('mcp'))"
          python -m pytest -q -p no:cacheprovider tests/test_mcp_server.py

  # LangSmith and Inspect AI adapters, end to end and offline (no API keys), on the
  # current releases and on the lowest versions the extras allow.
  integrations:
    name: integrations (${{ matrix.versions }}) / py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - versions: latest
            install: ".[langsmith,inspect]"
          - versions: minimum
            install: ". langsmith==0.2.0 inspect_ai==0.3.100"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        env:
          INSTALL: ${{ matrix.install }}
        run: pip install -e $INSTALL pytest
      - name: framework versions
        shell: python
        run: |
          import importlib.metadata as m
          print({p: m.version(p) for p in ("langsmith", "inspect_ai")})
      - run: python -m pytest -q -p no:cacheprovider -rs tests/test_integrations.py
        env:
          STED_EMBEDDING_MODEL: none

  # The released action referenced the way another repository would use it.
  action-remote:
    name: action from amazon-science/sted@v0.4.0
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: same outputs pass
        uses: amazon-science/sted@v0.4.0
        with:
          command: diff
          args: tests/fixtures/action/expected tests/fixtures/action/same --rules tests/fixtures/action/rules.json
      - name: a changed field fails
        id: changed
        continue-on-error: true
        uses: amazon-science/sted@v0.4.0
        with:
          command: diff
          args: tests/fixtures/action/expected tests/fixtures/action/changed --rules tests/fixtures/action/rules.json
      - name: the changed run must have failed with exit code 1
        shell: bash
        env:
          OUTCOME: ${{ steps.changed.outcome }}
          CODE: ${{ steps.changed.outputs.exit-code }}
        run: test "$OUTCOME" = "failure" && test "$CODE" = "1"

  # examples/integrations, run against the frameworks' current releases.
  examples:
    name: examples (${{ matrix.group }}) / py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: braintrust, weave
            packages: braintrust weave
          - group: deepeval, ragas, mlflow, promptfoo
            packages: deepeval ragas mlflow langchain-community<0.4
            promptfoo: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: matrix.promptfoo == '1'
        with:
          node-version: "22"
      - name: Install
        env:
          PACKAGES: ${{ matrix.packages }}
        run: pip install -e . pytest $PACKAGES
      - name: Run examples
        env:
          STED_EMBEDDING_MODEL: none
          STED_RUN_PROMPTFOO: ${{ matrix.promptfoo }}
        run: python -m pytest -q -p no:cacheprovider -rs tests/test_integration_examples.py

  # The composite action in action.yml, used the way other repositories would use it.
  action:
    name: action / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: same outputs pass
        uses: ./
        with:
          command: diff
          args: tests/fixtures/action/expected tests/fixtures/action/same --rules tests/fixtures/action/rules.json
      - name: a changed field fails
        id: changed
        continue-on-error: true
        uses: ./
        with:
          command: diff
          args: tests/fixtures/action/expected tests/fixtures/action/changed --rules tests/fixtures/action/rules.json
      - name: the changed run must have failed with exit code 1
        shell: bash
        env:
          OUTCOME: ${{ steps.changed.outcome }}
          CODE: ${{ steps.changed.outputs.exit-code }}
        run: |
          echo "outcome=$OUTCOME exit-code=$CODE"
          test "$OUTCOME" = "failure" && test "$CODE" = "1"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
